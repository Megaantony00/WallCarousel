AutoName: WallCarousel
Summary: Rotate home and lock wallpapers offline
Description: |
  WallCarousel rotates the photos you choose on the home and lock screens of
  your tablet. Photos are imported with the Android photo picker and copied
  into app-private storage, so the originals are never modified.

  Each screen can have its own carousel and its own schedule: an interval,
  specific times of day, an advance on every unlock, or any combination. The
  app has no internet permission, no analytics and no ads.

